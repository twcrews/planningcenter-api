on:
  push:
    tags:
    - '**'
  workflow_dispatch:
jobs:
  build:
    name: Publish NuGet package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Setup dotnet
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Verify commit exists in origin/master
      run: git merge-base --is-ancestor HEAD origin/master
    - name: Set VERSION variable from latest tag
      run: echo "VERSION=$(git describe --tags --abbrev=0)" >> $GITHUB_ENV
    - name: Build
      run: dotnet build Crews.PlanningCenter.Api --configuration Release /p:Version=${VERSION}
    - name: Test
      run: dotnet test Crews.PlanningCenter.Api.Tests --configuration Release /p:Version=${VERSION}
    - name: Pack
      run: dotnet pack Crews.PlanningCenter.Api --configuration Release /p:Version=${VERSION} --no-build --output .
    - name: NuGet login
      uses: NuGet/login@v1
      id: login
      with:
        user: ${{ secrets.NUGET_USER }}
    - name: Push
      run: dotnet nuget push Crews.PlanningCenter.Api.${VERSION}.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{steps.login.outputs.NUGET_API_KEY}}